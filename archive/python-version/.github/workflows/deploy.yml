name: Remove legacy AWS infrastructure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - scripts/cleanup_aws.py
      - terraform.tf
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-aws-infrastructure
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_lambda_password: "unused-during-destroy"
      STATE_BUCKET: sigfriedjk-quickquiz-generator-bundles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      # Fail closed: never treat a failed download as an empty infrastructure state.
      - name: Download existing Terraform state
        run: aws s3 cp "s3://$STATE_BUCKET/terraform.tfstate" terraform.tfstate
      - name: Initialize and validate Terraform
        run: |
          terraform init -input=false
          terraform validate
      - name: Plan destruction
        run: terraform plan -destroy -input=false -out=destroy.tfplan
      - name: Destroy tracked infrastructure
        id: destroy
        run: terraform apply -input=false -auto-approve destroy.tfplan
      - name: Preserve state after attempted destruction
        if: ${{ always() && steps.destroy.outcome != 'skipped' }}
        run: aws s3 cp terraform.tfstate "s3://$STATE_BUCKET/terraform.tfstate"
      - name: Remove untracked project resources and state bucket
        run: |
          python -m pip install boto3
          python scripts/cleanup_aws.py
